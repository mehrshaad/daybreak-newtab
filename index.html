<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- Placeholder only: boot.js corrects it before the first paint, and
         src/core/favicon.js keeps it following the browser/OS colour scheme
         from then on. -->
    <link rel="icon" type="image/png" href="favicon-dark.png" />
    <!-- Parser-blocking on purpose: paints the page the last-used theme and
         fixes the icon above before anything is on screen. External file
         because the extension CSP forbids inline script. 404s harmlessly on
         the GitHub Pages landing, which has its own fixed styling. -->
    <script src="./boot.js"></script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>New Tab</title>
    <!-- This file is two things at once.

         In the extension it is the new tab page: Vite builds it into
         dist/index.html and the app mounts into #root.

         On GitHub Pages it is the project's landing page, because Pages serves
         this branch and the module script below 404s there, leaving a blank
         page. #db-landing fills that in.

         It cannot flash in the extension: the built page loads the app's
         stylesheet from <head>, that stylesheet is render-blocking, and it
         carries `#db-landing { display: none }` (see src/styles/base.scss). So
         the block is hidden before the first paint, and no script is involved —
         an inline one would breach the extension's CSP.

         The mark is inline SVG rather than an <img> so it needs no file that
         only exists in one of the two layouts. -->
    <style>
      #db-landing {
        min-height: 100vh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 32px;
        box-sizing: border-box;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        color: #f4f5f8;
        background: radial-gradient(1100px 720px at 8% -12%, #6f9bff4a, transparent 62%),
          radial-gradient(900px 640px at 96% 4%, #6f9bff2b, transparent 58%), #0a0b0e;
      }
      #db-landing .db-card {
        max-width: 30rem;
        text-align: center;
      }
      #db-landing h1 {
        font-size: 2.5rem;
        font-weight: 600;
        letter-spacing: -0.03em;
        margin: 1.25rem 0 0.5rem;
      }
      #db-landing p {
        margin: 0 auto 1.75rem;
        font-size: 1rem;
        line-height: 1.65;
        color: #f4f5f8a0;
      }
      #db-landing nav {
        display: flex;
        flex-wrap: wrap;
        gap: 0.5rem;
        justify-content: center;
      }
      #db-landing a {
        display: inline-block;
        padding: 0.6rem 1.1rem;
        border-radius: 999px;
        border: 1px solid #ffffff1f;
        color: #f4f5f8;
        text-decoration: none;
        font-size: 0.9rem;
      }
      #db-landing a:hover {
        border-color: #6f9bff;
        color: #6f9bff;
      }
      #db-landing footer {
        margin-top: 2.5rem;
        font-size: 0.8rem;
        color: #f4f5f866;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>

    <div id="db-landing">
      <div class="db-card">
        <svg width="88" height="88" viewBox="0 0 96 96" aria-label="Daybreak" role="img">
          <rect width="96" height="96" rx="22" fill="#0d0e12" />
          <g stroke="#f9a63a" stroke-width="5" stroke-linecap="round">
            <path d="M48 20v8" />
            <path d="M28.6 28.6l5.7 5.7" />
            <path d="M67.4 28.6l-5.7 5.7" />
            <path d="M20 48h8" />
            <path d="M68 48h8" />
          </g>
          <path d="M30 58a18 18 0 0 1 36 0z" fill="#f9a63a" />
          <g stroke="#4b86f7" stroke-width="5" stroke-linecap="round">
            <path d="M22 66h52" />
            <path d="M30 76h36" />
          </g>
        </svg>
        <h1>Daybreak</h1>
        <p>
          A Chrome new tab page you arrange yourself — a board of widgets with a
          clock, the weather, your tasks and your links. No accounts, no
          tracking.
        </p>
        <nav>
          <a href="https://github.com/mehrshaad/daybreak-newtab">Source on GitHub</a>
          <a href="https://github.com/mehrshaad/daybreak-newtab/releases">Download</a>
          <a href="privacy-policy.html">Privacy policy</a>
        </nav>
        <footer>© 2026 Ali Dadashzadeh (Mehrshad) · MIT</footer>
      </div>
    </div>

    <script type="module" src="./src/main.jsx"></script>
  </body>
</html>
